<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Copy and Paste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copy and Paste">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f4f4fb;--card:#fff;--text:#16162a;--muted:#757590;--accent:#6366f1;--accent2:#a855f7;--line:#e4e4f0;--star:#f5a524;--title:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#0f1020;--card:#1a1b30;--text:#ececff;--muted:#9a9ab8;--line:#2a2b45;--title:#b794f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;
  padding-top:calc(env(safe-area-inset-top) + 14px)}
h1{font-size:22px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px}
.nm{font-weight:700;font-size:18px;text-transform:uppercase;margin-bottom:4px;word-break:break-word;color:var(--title)}
#nameInput{text-transform:uppercase}
input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.paste{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;
  padding:16px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 18px rgba(99,102,241,.35)}
.paste:active{transform:scale(.98)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=search]{width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-size:16px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:6px 16px}
.item{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);
  border-radius:16px;margin:10px 0;overflow:hidden}
.body{flex:1;min-width:0;padding:12px 0 12px 12px}
.txt{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--muted);font-size:12px;margin-top:6px}
.preview{display:flex;gap:10px;align-items:center;margin-bottom:8px;max-width:300px;padding:6px;border-radius:12px;background:var(--bg);
  text-decoration:none;color:inherit}
.preview img.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:#fff}
.preview .t{font-weight:600;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.preview .d{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(2,44px);align-content:center;gap:2px;padding:6px}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.ib.copy{background:var(--accent);color:#fff}
.ib:active{transform:scale(.9)}
.ib.star.on{color:var(--star)}.ib.star.on svg{fill:var(--star)}
.empty{text-align:center;color:var(--muted);margin:50px 20px}
footer{display:flex;gap:10px;justify-content:center;padding:10px;font-size:13px}
footer button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);opacity:0;
  background:#16162a;color:#fff;padding:10px 18px;border-radius:20px;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--text)}
dialog textarea{width:100%;height:120px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px;font-size:16px}
dialog .row{display:flex;gap:8px;margin-top:10px}
dialog button{flex:1;padding:12px;border-radius:12px;border:0;font-size:16px;background:var(--line);color:var(--text)}
dialog button.pri{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1><img src="logo.svg" alt="" class="logo">My Copy and Paste</h1>
  <button class="paste" id="pasteBtn" aria-label="Colar">
    <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
    Colar do clipboard
  </button>
  <input type="search" id="q" placeholder="Buscar...">
  <div class="tabs">
    <button class="tab on" data-t="all">Todos</button>
    <button class="tab" data-t="fav">Favoritos</button>
  </div>
</header>
<main id="list"></main>
<footer>
  <button id="exp">Exportar</button>
  <button id="imp">Importar</button>
  <button id="clr">Limpar não favoritos</button>
  <input type="file" id="file" accept="application/json" hidden>
</footer>
<div id="toast"></div>

<dialog id="nameDlg">
  <p style="margin:0 0 6px">Nome do card (usado na busca):</p>
  <input type="text" id="nameInput" maxlength="60" placeholder="Ex.: Chave Pix, Endereço de casa">
  <p style="margin:12px 0 6px">Texto:</p>
  <textarea id="editText" placeholder="Conteúdo do card"></textarea>
  <div class="row"><button id="nCancel">Cancelar</button><button class="pri" id="nOk">Salvar</button></div>
</dialog>

<dialog id="dlg">
  <p style="margin-top:0">O iOS bloqueou a leitura automática. Cole o texto aqui:</p>
  <textarea id="manual" placeholder="Toque e segure, depois Colar"></textarea>
  <div class="row"><button id="dCancel">Cancelar</button><button class="pri" id="dOk">Salvar</button></div>
</dialog>

<script>
const KEY = 'clip.items.v1';
const $ = s => document.querySelector(s);
const ICON = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  del: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></svg>'
};
let items = JSON.parse(localStorage.getItem(KEY) || '[]');
let tab = 'all', query = '';
const save = () => localStorage.setItem(KEY, JSON.stringify(items));

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600)}
const isUrl = s => /^https?:\/\/\S+$/i.test(s.trim());

/* ---------- copiar ---------- */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch{
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity=0;
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,1e6);document.execCommand('copy');ta.remove();
  }
  toast('Copiado');
  if(navigator.vibrate)navigator.vibrate(15);
}

/* ---------- adicionar ---------- */
function addItem(text){
  text = text.trim(); if(!text) return false;
  const ex = items.find(i => i.text === text);
  if(ex){ items = [ex, ...items.filter(i => i !== ex)]; ex.ts = Date.now(); }
  else { const it = {id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), text, fav:false, ts:Date.now()};
         items.unshift(it); if(isUrl(text)) fetchPreview(it); }
  save(); render(); return true;
}

async function pasteFromClipboard(){
  try{
    const t = await navigator.clipboard.readText();
    if(!t || !t.trim()){ toast('Clipboard vazio'); return; }
    const isNew = !items.some(i => i.text === t.trim());
    addItem(t); toast('Colado');
    if(isNew && !isUrl(t)) askName(items[0]); // texto simples: pede um nome (pode pular)
  }catch{ $('#manual').value=''; $('#dlg').showModal(); }
}

/* ---------- miniatura do link ---------- */
const favicon = u => 'https://www.google.com/s2/favicons?sz=128&domain_url=' + encodeURIComponent(u);
async function fetchPreview(it){
  it.pv = {host: new URL(it.text).hostname.replace(/^www\./,''), icon: favicon(it.text)};
  render();
  try{
    const r = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(it.text));
    const j = await r.json();
    if(j.status === 'success'){
      const d = j.data;
      it.pv.title = d.title || ''; it.pv.desc = d.description || '';
      it.pv.image = d.image && d.image.url || ''; if(d.logo && d.logo.url) it.pv.icon = d.logo.url;
    }
  }catch{}
  save(); render();
}

/* ---------- render ---------- */
function fmt(ts){return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function btn(cls, html, label, fn){const b=document.createElement('button');b.className='ib '+cls;b.innerHTML=html;b.setAttribute('aria-label',label);b.onclick=fn;return b}

function render(){
  const list = $('#list'); list.innerHTML = '';
  const q = query.toLowerCase();
  const vis = items.filter(i => (tab==='all' || i.fav) && (!q || i.text.toLowerCase().includes(q) || (i.name||'').toLowerCase().includes(q) || (i.pv&&i.pv.title||'').toLowerCase().includes(q)));
  if(!vis.length){ list.innerHTML = '<div class="empty">'+(tab==='fav'?'Nenhum favorito ainda.<br>Toque na estrela de um item.':'Nada por aqui.<br>Copie algo e toque em <b>Colar do clipboard</b>.')+'</div>'; return; }
  for(const it of vis){
    const el = document.createElement('div'); el.className='item';
    const body = document.createElement('div'); body.className='body';
    if(it.name){ const nm = document.createElement('div'); nm.className='nm'; nm.textContent = it.name; body.appendChild(nm); }
    if(it.pv){
      const a = document.createElement('a'); a.href=it.text; a.target='_blank'; a.rel='noopener'; a.className='preview';
      a.innerHTML = '<img class="thumb" alt=""><div style="min-width:0"><div class="t"></div><div class="d"></div></div>';
      const th = a.querySelector('.thumb');
      th.src = it.pv.image || it.pv.icon;
      th.onerror = () => { if(th.src !== it.pv.icon && it.pv.icon){ th.src = it.pv.icon; } else th.style.visibility='hidden'; };
      a.querySelector('.t').textContent = it.pv.title || it.pv.host;
      a.querySelector('.d').textContent = it.pv.host;
      body.appendChild(a);
    }
    const txt = document.createElement('div'); txt.className='txt'; txt.textContent = it.text;
    txt.onclick = () => copyText(it.text);
    const meta = document.createElement('div'); meta.className='meta'; meta.textContent = fmt(it.ts);
    body.append(txt, meta);
    const acts = document.createElement('div'); acts.className='acts';
    acts.append(
      btn('copy', ICON.copy, 'Copiar', () => copyText(it.text)),
      btn('', ICON.edit, 'Editar', () => askName(it)),
      btn('star'+(it.fav?' on':''), ICON.star, 'Favoritar', () => { it.fav=!it.fav; save(); render(); }),
      btn('', ICON.del, 'Apagar', () => { if(confirm('Apagar este item?')){ items=items.filter(x=>x!==it); save(); render(); } })
    );
    el.append(body, acts); list.appendChild(el);
  }
}

/* ---------- nomear card ---------- */
let naming = null;
function askName(it){ naming = it; $('#nameInput').value = it.name || ''; $('#editText').value = it.text; $('#nameDlg').showModal(); }
function saveName(){
  if(naming){
    naming.name = $('#nameInput').value.trim().toUpperCase();
    const t = $('#editText').value.trim();
    if(t && t !== naming.text){
      naming.text = t; naming.ts = Date.now(); delete naming.pv;
      if(isUrl(t)) fetchPreview(naming);
    }
    save(); render();
  }
  $('#nameDlg').close(); naming = null;
}
$('#nOk').onclick = saveName;
$('#nCancel').onclick = () => { $('#nameDlg').close(); naming = null; };
$('#nameInput').onkeydown = e => { if(e.key === 'Enter') saveName(); };

/* ---------- eventos ---------- */
$('#pasteBtn').onclick = pasteFromClipboard;
$('#q').oninput = e => { query = e.target.value; render(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); b.classList.add('on'); tab = b.dataset.t; render();
});
$('#dCancel').onclick = () => $('#dlg').close();
$('#dOk').onclick = () => { if(addItem($('#manual').value)) toast('Salvo'); $('#dlg').close(); };
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));
  a.download = 'clipboard-backup.json'; a.click();
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  try{
    const data = JSON.parse(await e.target.files[0].text());
    const known = new Set(items.map(i => i.text)); let n = 0;
    for(const d of data) if(d && d.text && !known.has(d.text)){ items.push({id:d.id||String(Math.random()),text:d.text,name:d.name||'',fav:!!d.fav,ts:d.ts||Date.now(),pv:d.pv}); n++; }
    items.sort((a,b)=>b.ts-a.ts); save(); render(); toast(n+' importados');
  }catch{ toast('Arquivo inválido'); }
  e.target.value='';
};
$('#clr').onclick = () => { if(confirm('Apagar tudo que não é favorito?')){ items = items.filter(i=>i.fav); save(); render(); } };

/* Atalhos do iOS: abrir  .../index.html?add=TEXTO  salva automaticamente */
const p = new URLSearchParams(location.search);
if(p.get('add')){ addItem(p.get('add')); history.replaceState(null,'',location.pathname); }

items.filter(i => isUrl(i.text) && !i.pv).forEach(fetchPreview);
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
